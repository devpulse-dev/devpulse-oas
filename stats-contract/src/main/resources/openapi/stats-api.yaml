openapi: 3.0.3
info:
  title: DevPulse - Stats API
  version: 1.1.0
  description: API для получения статистики по разработчикам

servers:
  - url: http://localhost:8080/api/v2
    description: Локальный сервер разработки
  - url: https://api.devpulse.dev/api/v2
    description: Продакшн сервер

tags:
  - name: Stats
    description: Статистика по разработчикам
  - name: Cohorts
    description: Когорты и удержание (лонгитюд по истории коммитов)

# Auth handled outside the contract (gateway / SSO). API exposes no
# operation-level security requirements.
security: []

paths:
  /cohorts/retention:
    get:
      tags:
        - Cohorts
      summary: Retention-треугольник по когортам (месяц первой активности)
      description: |
        Когорта = месяц первой активности разработчика (≥ minCommits не-мердж коммитов в месяце).
        retention[k] = доля разработчиков когорты, активных через k месяцев; retention[0] == 1.
        Считается из истории коммитов (commit_details/daily_author_stats), без снапшотов.
        Окно from/to — диапазон истории (по умолчанию вся доступная).
      operationId: getCohortRetention
      parameters:
        - $ref: 'shared.yaml#/components/parameters/OptionalPeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/OptionalPeriodTo'
        - name: team
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по текущей команде разработчика (unified_user.team)
        - name: minCommits
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
            minimum: 1
          description: Порог «активен» — минимум не-мердж коммитов в месяце
      responses:
        '200':
          description: Треугольник удержания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortRetention'
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /cohorts/activity-matrix:
    get:
      tags:
        - Cohorts
      summary: Матрица активности «разработчик × месяц»
      description: |
        Для каждого разработчика — не-мердж коммиты по месяцам (cells выровнены по months),
        первый/последний активный месяц. Источник — история коммитов, без снапшотов.
      operationId: getCohortActivityMatrix
      parameters:
        - $ref: 'shared.yaml#/components/parameters/OptionalPeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/OptionalPeriodTo'
        - name: team
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по текущей команде разработчика (unified_user.team)
      responses:
        '200':
          description: Матрица активности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortActivityMatrix'
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /cohorts/tier-transitions:
    get:
      tags:
        - Cohorts
      summary: Матрица переходов тиров активности месяц-к-месяцу
      description: |
        4×4 матрица: доля переходов INACTIVE/BELOW_AVERAGE/ACTIVE/STAR из тира в тир между
        соседними месяцами, усреднённая по окну. Строки — откуда, сумма строки = 1.
        Тир за месяц пересчитывается из коммитов того месяца (ActivityScorer) — снапшоты не нужны.
      operationId: getTierTransitions
      parameters:
        - $ref: 'shared.yaml#/components/parameters/OptionalPeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/OptionalPeriodTo'
        - name: team
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по текущей команде разработчика (unified_user.team)
      responses:
        '200':
          description: Матрица переходов тиров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierTransitions'
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /stats/daily:
    get:
      tags:
        - Stats
      summary: Получить дневную статистику
      description: |
        Дневные агрегаты за период (по ключу email × date × repo).
        
        Здесь displayName/avatarUrl НЕ возвращаются — дневных записей много (тысячи за период), enrichment дорогой. 
        Если нужны профили — фронт может агрегировать по email на своей стороне и подтянуть из /dashboard или /users/{email}/profile.
      operationId: getDailyStats
      parameters:
        - $ref: 'shared.yaml#/components/parameters/PeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/PeriodTo'
      responses:
        '200':
          description: Дневная статистика
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'shared.yaml#/components/schemas/DailyStats'
              example:
                - id: 12345
                  email: "boris@x5.ru"
                  date: "2026-05-10"
                  repo: "xrg-core"
                  commits: 3
                  mergeCommits: 0
                  addedLines: 124
                  deletedLines: 58
                  testAddedLines: 22
                  lastUpdated: "2026-05-10T01:02:15"
                  userId: 42
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /stats/weekly:
    get:
      tags:
        - Stats
      summary: Получить недельную статистику
      description: |
        Группировка по ISO-неделям, для каждой недели — totals и per-author breakdown с enriched displayName/avatarUrl. 
        Список отсортирован по возрастанию weekStart.
      operationId: getWeeklyStats
      parameters:
        - $ref: 'shared.yaml#/components/parameters/PeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/PeriodTo'
      responses:
        '200':
          description: Недельная статистика
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'shared.yaml#/components/schemas/WeeklyStats'
              example:
                - year: 2026
                  week: 19
                  weekStart: "2026-05-04"
                  totalCommits: 47
                  totalMergeCommits: 3
                  totalAddedLines: 1820
                  totalDeletedLines: 850
                  totalTestAddedLines: 320
                  authors:
                    - email: "boris@x5.ru"
                      displayName: "Boris"
                      avatarUrl: "https://kaiten.x5.ru/.../avatar.png"
                      commits: 12
                      nonMergeCommits: 11
                      mergeCommits: 1
                      addedLines: 480
                      deletedLines: 200
                      testAddedLines: 90
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /stats/hourly:
    get:
      tags:
        - Stats
      summary: Получить почасовую статистику
      description: |
        Почасовая агрегация не-мердж коммитов за период по ключу (день недели × час) —
        матрица 7×24 для heatmap «паттерны работы по часам/дням».

        Агрегацию делает БД (GROUP BY по дню недели и часу), чтобы не поднимать тысячи
        коммитов на клиент. Пустые ячейки (0 коммитов) могут опускаться — клиент
        достраивает полную сетку.

        Фильтры опциональны и независимы:
        - `email` — один автор (для профиля);
        - `team` — только участники команды (для Activity-страницы; членство по
          `unified_user.team`, коммиты без сопоставленного пользователя в выборку не входят);
        - без фильтров — агрегат по всем.
      operationId: getHourlyStats
      parameters:
        - $ref: 'shared.yaml#/components/parameters/PeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/PeriodTo'
        - name: email
          in: query
          required: false
          schema:
            $ref: 'shared.yaml#/components/schemas/Email'
          description: Email автора для фильтрации. Без параметра — агрегат по всем.
          example: "boris@x5.ru"
        - name: team
          in: query
          required: false
          schema:
            type: string
          description: |
            Команда для фильтрации (значение `unified_user.team`). Без параметра — без
            ограничения по команде. Несуществующая команда даёт пустую матрицу.
          example: "Platform"
      responses:
        '200':
          description: Почасовая статистика
          content:
            application/json:
              schema:
                $ref: 'shared.yaml#/components/schemas/HourlyStats'
              example:
                from: "2026-05-01"
                to: "2026-05-31"
                cells:
                  - weekday: 0
                    hour: 10
                    commits: 12
                    addedLines: 540
                  - weekday: 2
                    hour: 14
                    commits: 7
                    addedLines: 320
                  - weekday: 5
                    hour: 23
                    commits: 2
                    addedLines: 40
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /stats/summary:
    get:
      tags:
        - Stats
      summary: Получить сводку за период
      description: |
        Сводка за период: totals + топ-10 авторов с enriched displayName/avatarUrl. 
        Топ отсортирован по убыванию всех коммитов (включая мерджи) — это исторически так, для top-N это менее критично чем для дашборда.
      operationId: getSummaryStats
      parameters:
        - $ref: 'shared.yaml#/components/parameters/PeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/PeriodTo'
      responses:
        '200':
          description: Сводка за период
          content:
            application/json:
              schema:
                $ref: 'shared.yaml#/components/schemas/PeriodSummary'
              example:
                from: "2026-05-01"
                to: "2026-05-31"
                totalCommits: 312
                totalMergeCommits: 18
                totalAddedLines: 12400
                totalDeletedLines: 5800
                totalTestAddedLines: 2120
                uniqueAuthors: 14
                topAuthors:
                  - email: "boris@x5.ru"
                    displayName: "Boris"
                    avatarUrl: "https://kaiten.x5.ru/.../avatar.png"
                    commits: 47
                    nonMergeCommits: 44
                    mergeCommits: 3
                    addedLines: 1820
                    deletedLines: 850
                    testAddedLines: 320
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /stats/reviews:
    get:
      tags:
        - Stats
      summary: Получить ревью-метрики за период
      description: |
        Метрики code review по авторам за период: кто тащит ревью, баланс «пишу / ревьюю»,
        среднее время до merge. Сильный сигнал здоровья команды — обычно невидимый.

        Данные о ревью собираются из API Git-провайдера (GitLab MR / GitHub PR): approvals,
        timestamps открытия/merge. Это отдельный источник от коммитов.
      operationId: getReviewStats
      parameters:
        - $ref: 'shared.yaml#/components/parameters/PeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/PeriodTo'
      responses:
        '200':
          description: Ревью-метрики за период
          content:
            application/json:
              schema:
                $ref: 'shared.yaml#/components/schemas/ReviewStats'
              example:
                from: "2026-05-01"
                to: "2026-05-31"
                authors:
                  - email: "boris@x5.ru"
                    displayName: "Boris"
                    avatarUrl: "https://kaiten.x5.ru/avatars/42.png"
                    reviewsGiven: 23
                    commentsGiven: 47
                    reviewsReceived: 14
                    avgTimeToMergeHours: 18.5
                    mergedMrCount: 11
                  - email: "alice@x5.ru"
                    displayName: null
                    avatarUrl: null
                    reviewsGiven: 5
                    commentsGiven: 31
                    reviewsReceived: 19
                    avgTimeToMergeHours: 42.0
                    mergedMrCount: 17
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /performance/review:
    get:
      tags:
        - Stats
      summary: Досье к Performance Review
      description: |
        Агрегированное «досье» по одному человеку за период для подготовки к perf-review:
        код (коммиты/строки/тест-строки), ревью (given/received), задачи Kaiten по типам
        (дефекты / разработка). Каждая метрика — с дельтой к предыдущему равному периоду
        (если compareToPrevious=true).

        Это read-model поверх уже собранных данных — отдельного сбора не запускает.

        ВАЖНО (снапшот «как сейчас»): счётчики дефектов/задач считаются по ТЕКУЩЕМУ
        состоянию карточек Kaiten (live), отфильтрованных по пересечению с периодом.
        Для отчёта за давно прошедший период состояние карточек может уже измениться —
        фронту стоит это подписать. См. future.md (Фаза 3 снимает ограничение).

        testAddedLines — это СТРОКИ тест-кода, не количество тестов.
      operationId: getPerformanceReview
      parameters:
        - name: email
          in: query
          required: true
          schema:
            $ref: 'shared.yaml#/components/schemas/Email'
          description: Email человека, по которому собирается досье
          example: "boris@x5.ru"
        - $ref: 'shared.yaml#/components/parameters/PeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/PeriodTo'
        - name: compareToPrevious
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            Считать дельты к предыдущему периоду равной длины, встык перед from.
            false — поля previous/delta/deltaPct у метрик будут null, comparedTo = null.
          example: true
      responses:
        '200':
          description: Досье к perf-review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceReview'
              example:
                subject:
                  id: 42
                  email: "boris@x5.ru"
                  username: "boris"
                  name: "Boris"
                  avatarUrl: null
                  kaitenId: 7
                  gitlabId: null
                  team: "Platform"
                period:
                  from: "2026-01-01"
                  to: "2026-03-31"
                comparedTo:
                  from: "2025-10-03"
                  to: "2025-12-31"
                metrics:
                  commits: { current: 312, previous: 280, delta: 32, deltaPct: 11.4 }
                  nonMergeCommits: { current: 294, previous: 265, delta: 29, deltaPct: 10.9 }
                  addedLines: { current: 12400, previous: 11800, delta: 600, deltaPct: 5.1 }
                  deletedLines: { current: 5800, previous: 5200, delta: 600, deltaPct: 11.5 }
                  testAddedLines: { current: 2120, previous: 1500, delta: 620, deltaPct: 41.3 }
                  reviewsGiven: { current: 64, previous: 50, delta: 14, deltaPct: 28.0 }
                  commentsGiven: { current: 180, previous: 150, delta: 30, deltaPct: 20.0 }
                  reviewsReceived: { current: 40, previous: 38, delta: 2, deltaPct: 5.3 }
                  avgTimeToMergeHours: { current: 18.5, previous: 22.0, delta: -3.5, deltaPct: -15.9 }
                  mergedMrCount: { current: 28, previous: 25, delta: 3, deltaPct: 12.0 }
                  defectsInWork: { current: 4, previous: null, delta: null, deltaPct: null }
                  defectsClosed: { current: 11, previous: 9, delta: 2, deltaPct: 22.2 }
                  devTasksInWork: { current: 6, previous: null, delta: null, deltaPct: null }
                  devTasksClosed: { current: 19, previous: 17, delta: 2, deltaPct: 11.8 }
                taskBreakdown:
                  defect: { inProgress: 4, done: 11, total: 15 }
                  development: { inProgress: 6, done: 19, total: 25 }
                highlights:
                  - kind: "CARD"
                    title: "Critical: расчёт скидок ломается на null-цене"
                    subtitle: "DEFECT · DONE"
                    url: "https://kaiten.x5.ru/2963977"
                  - kind: "MR"
                    title: "feat: новый расчётный движок"
                    subtitle: "merged · 12h to merge"
                    url: "https://scm.x5.ru/xrg-core/-/merge_requests/812"
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: 'shared.yaml#/components/responses/NotFound'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

components:
  schemas:
    CohortRetention:
      type: object
      description: Retention-треугольник по когортам (месяц первой активности).
      required:
        - interval
        - cohorts
      properties:
        interval:
          type: string
          enum: [month]
        cohorts:
          type: array
          items:
            type: object
            required:
              - cohort
              - size
              - retention
            properties:
              cohort:
                type: string
                description: "Месяц первой активности, 'YYYY-MM'"
                example: "2026-01"
              size:
                type: integer
                format: int32
                description: Сколько разработчиков впервые активны в этот месяц
              retention:
                type: array
                description: "Доли 0..1 по смещению k; retention[0] == 1"
                items:
                  type: number
                  format: double

    CohortActivityMatrix:
      type: object
      description: Матрица активности «разработчик × месяц» (не-мердж коммиты).
      required:
        - months
        - developers
      properties:
        months:
          type: array
          description: "Ось колонок, 'YYYY-MM' по возрастанию"
          items:
            type: string
        developers:
          type: array
          items:
            type: object
            required:
              - email
              - firstActive
              - lastActive
              - cells
            properties:
              email:
                $ref: 'shared.yaml#/components/schemas/Email'
              displayName:
                type: string
                nullable: true
              avatarUrl:
                type: string
                nullable: true
              team:
                type: string
                nullable: true
              firstActive:
                type: string
                example: "2026-01"
              lastActive:
                type: string
                example: "2026-06"
              cells:
                type: array
                description: "Не-мердж коммиты по месяцам (выровнены по months); 0 = неактивен"
                items:
                  type: integer
                  format: int32

    TierTransitions:
      type: object
      description: 4×4 матрица переходов тиров активности месяц-к-месяцу.
      required:
        - tiers
        - matrix
      properties:
        tiers:
          type: array
          items:
            type: string
            enum: [INACTIVE, BELOW_AVERAGE, ACTIVE, STAR]
        matrix:
          type: array
          description: "Строки — откуда, сумма строки = 1"
          items:
            type: array
            items:
              type: number
              format: double

    PerformanceReview:
      type: object
      description: Досье к perf-review по одному человеку за период.
      required:
        - subject
        - period
        - metrics
        - taskBreakdown
        - kaiten
        - notable
      properties:
        subject:
          $ref: 'shared.yaml#/components/schemas/UserProfile'
        period:
          $ref: 'shared.yaml#/components/schemas/Period'
        comparedTo:
          type: object
          allOf:
            - $ref: 'shared.yaml#/components/schemas/Period'
          nullable: true
          description: Предыдущий период сравнения. null, если compareToPrevious=false.
        metrics:
          $ref: '#/components/schemas/PerformanceMetrics'
        taskBreakdown:
          $ref: '#/components/schemas/TaskTypeBreakdown'
        kaiten:
          $ref: '#/components/schemas/KaitenInsights'
        notable:
          $ref: '#/components/schemas/NotableResults'

    MetricDelta:
      type: object
      description: |
        Значение метрики с дельтой к предыдущему периоду. previous/delta/deltaPct = null,
        если сравнение не запрашивалось ИЛИ метрика неисторична (снапшот «как сейчас»,
        например *InWork). deltaPct = (current − previous) / previous × 100; null при previous = 0.
      required:
        - current
      properties:
        current:
          type: number
          format: double
          description: Значение за текущий период.
          example: 312
        previous:
          type: number
          format: double
          nullable: true
          description: Значение за предыдущий период.
          example: 280
        delta:
          type: number
          format: double
          nullable: true
          description: current − previous.
          example: 32
        deltaPct:
          type: number
          format: double
          nullable: true
          description: Изменение в процентах.
          example: 11.4

    PerformanceMetrics:
      type: object
      description: |
        Набор метрик досье. Счётчики целочисленны по смыслу, но обёрнуты в MetricDelta
        (number/double) ради единообразия виджета дельты на фронте. *InWork — снапшот
        «как сейчас», у них previous/delta всегда null.
      required:
        - commits
        - nonMergeCommits
        - addedLines
        - deletedLines
        - testAddedLines
        - reviewsGiven
        - commentsGiven
        - reviewsReceived
        - avgTimeToMergeHours
        - mergedMrCount
        - defectsInWork
        - defectsClosed
        - devTasksInWork
        - devTasksClosed
      properties:
        commits: { $ref: '#/components/schemas/MetricDelta' }
        nonMergeCommits: { $ref: '#/components/schemas/MetricDelta' }
        addedLines: { $ref: '#/components/schemas/MetricDelta' }
        deletedLines: { $ref: '#/components/schemas/MetricDelta' }
        testAddedLines: { $ref: '#/components/schemas/MetricDelta' }
        reviewsGiven: { $ref: '#/components/schemas/MetricDelta' }
        commentsGiven: { $ref: '#/components/schemas/MetricDelta' }
        reviewsReceived: { $ref: '#/components/schemas/MetricDelta' }
        avgTimeToMergeHours: { $ref: '#/components/schemas/MetricDelta' }
        mergedMrCount: { $ref: '#/components/schemas/MetricDelta' }
        defectsInWork: { $ref: '#/components/schemas/MetricDelta' }
        defectsClosed: { $ref: '#/components/schemas/MetricDelta' }
        devTasksInWork: { $ref: '#/components/schemas/MetricDelta' }
        devTasksClosed: { $ref: '#/components/schemas/MetricDelta' }

    TaskTypeBreakdown:
      type: object
      description: Разбивка карточек Kaiten по типу и статусу (для стэкбаров).
      required:
        - defect
        - development
      properties:
        defect:
          $ref: '#/components/schemas/TaskStatusCounts'
        development:
          $ref: '#/components/schemas/TaskStatusCounts'

    TaskStatusCounts:
      type: object
      required:
        - inProgress
        - done
        - total
      properties:
        inProgress:
          type: integer
          format: int32
          description: Карточки в работе (columnStatus == IN_PROGRESS на момент запроса).
          example: 4
        done:
          type: integer
          format: int32
          description: Карточки, закрытые в периоде (closedAt в [from, to]).
          example: 11
        total:
          type: integer
          format: int32
          description: Всего карточек этого типа, пересекающихся с периодом.
          example: 15

    NotableResults:
      type: object
      description: |
        Заметные результаты за период — два осмысленных среза. Строятся на надёжных сигналах
        (срочность дефекта, завершённость, уровень фичи); member.type/«ответственный» и time_spent
        НЕ используются (первый = владелец карточки, не исполнитель; второй заполняется руками).
      required:
        - firefighting
        - deliveredFeatures
      properties:
        firefighting:
          type: array
          description: «🔥 Тушение пожаров» — закрытые в периоде критичные/высокие дефекты.
          items:
            $ref: '#/components/schemas/FirefightingItem'
        deliveredFeatures:
          type: array
          description: «🚀 Доставленные доработки» — корневые задачи с завершёнными юскейсами.
          items:
            $ref: '#/components/schemas/DeliveredFeature'

    FirefightingItem:
      type: object
      description: Закрытый критичный/высокий дефект.
      required:
        - id
        - title
        - urgency
      properties:
        id:
          type: integer
          format: int64
          example: 2963977
        title:
          type: string
          example: "Critical: расчёт скидок ломается на null-цене"
        url:
          type: string
          format: uri
          nullable: true
          example: "https://kaiten.x5.ru/2963977"
        urgency:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
          description: На практике только CRITICAL/HIGH.
          example: "CRITICAL"

    DeliveredFeature:
      type: object
      description: Доставленная доработка — корневая задача с завершёнными юскейсами.
      required:
        - id
        - title
        - doneCount
        - totalCount
      properties:
        id:
          type: integer
          format: int64
          example: 3263902
        title:
          type: string
          example: "[ТС5] [ЦМП] GK. Разработка. 1960136. Пиво."
        url:
          type: string
          format: uri
          nullable: true
          example: "https://kaiten.x5.ru/3263902"
        doneCount:
          type: integer
          format: int32
          description: Сколько юскейсов закрыто (DONE).
          example: 5
        totalCount:
          type: integer
          format: int32
          description: Всего юскейсов под корневой задачей.
          example: 6

    KaitenInsights:
      type: object
      description: |
        Развёрнутая аналитика по карточкам Kaiten за период (снапшот «как сейчас»):
        дефекты по срочности, разработка по корневым задачам, cycle-time, баланс работы.
      required:
        - defects
        - development
        - cycleTime
        - balance
      properties:
        defects:
          $ref: '#/components/schemas/DefectsSummary'
        development:
          $ref: '#/components/schemas/DevelopmentRollup'
        cycleTime:
          $ref: '#/components/schemas/CycleTimeBreakdown'
        balance:
          $ref: '#/components/schemas/WorkBalance'

    DefectsSummary:
      type: object
      description: Дефекты субъекта за период с разбивкой по срочности.
      required:
        - total
        - inWork
        - closed
        - criticalHigh
        - byUrgency
      properties:
        total:
          type: integer
          format: int32
          example: 15
        inWork:
          type: integer
          format: int32
          description: Открытые в работе (columnStatus == IN_PROGRESS).
          example: 4
        closed:
          type: integer
          format: int32
          description: Закрытые в периоде.
          example: 11
        criticalHigh:
          type: integer
          format: int32
          description: KPI «горящие» — критичные + высокие.
          example: 6
        byUrgency:
          $ref: '#/components/schemas/UrgencyCounts'

    UrgencyCounts:
      type: object
      description: Счётчики дефектов по срочности (из property id_2561).
      required:
        - critical
        - high
        - medium
        - low
        - unknown
      properties:
        critical:
          type: integer
          format: int32
          example: 4
        high:
          type: integer
          format: int32
          example: 2
        medium:
          type: integer
          format: int32
          example: 5
        low:
          type: integer
          format: int32
          example: 4
        unknown:
          type: integer
          format: int32
          description: Срочность не задана/неизвестный код.
          example: 0

    DevelopmentRollup:
      type: object
      description: Разработка (тип «разработка» + «задача»), агрегированная по корневой задаче.
      required:
        - useCaseCount
        - rootTaskCount
        - roots
      properties:
        useCaseCount:
          type: integer
          format: int32
          description: Всего карточек-юскейсов.
          example: 12
        rootTaskCount:
          type: integer
          format: int32
          description: Число уникальных реальных корневых задач (без синтетического ведра).
          example: 4
        roots:
          type: array
          description: Корневые задачи с юскейсами; синтетическое «Без корневой задачи» — последним.
          items:
            $ref: '#/components/schemas/RootTask'

    RootTask:
      type: object
      description: Корневая задача с её юскейсами (узел аккордеона).
      required:
        - title
        - useCases
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: id карточки Kaiten; null — синтетическое ведро «Без корневой задачи».
          example: 3263902
        title:
          type: string
          example: "[ТС5] [ЦМП] GK. Разработка. 1960136. Пиво. Отключение потока"
        url:
          type: string
          format: uri
          nullable: true
          example: "https://kaiten.x5.ru/3263902"
        useCases:
          type: array
          items:
            $ref: '#/components/schemas/UseCaseRef'

    UseCaseRef:
      type: object
      description: Карточка-юскейс внутри корневой задачи.
      required:
        - id
        - title
        - status
        - type
      properties:
        id:
          type: integer
          format: int64
          example: 3263984
        title:
          type: string
          example: "[РТ] UC4.[ТС5] [ЦМП] GK. Разработка. 1960136. Пиво."
        url:
          type: string
          format: uri
          nullable: true
          example: "https://kaiten.x5.ru/3263984"
        status:
          type: string
          enum: [NEW, IN_PROGRESS, DONE, UNKNOWN]
          example: "DONE"
        type:
          type: string
          enum: [DEVELOPMENT, TASK, DEFECT, OTHER]
          description: Тип карточки-юскейса (на практике DEVELOPMENT или TASK).
          example: "DEVELOPMENT"

    CycleTimeBreakdown:
      type: object
      description: |
        Cycle-time раздельно по дефектам и разработке — длительность у них разная
        (разработка обычно дольше), общая медиана была бы некорректной.
      required:
        - defects
        - development
      properties:
        defects:
          $ref: '#/components/schemas/CycleTime'
        development:
          $ref: '#/components/schemas/CycleTime'

    CycleTime:
      type: object
      description: |
        Cycle-time по карточкам, закрытым в периоде: от первого перехода «в работу»
        до перехода «готово». medianDays/meanDays = null, если данных нет (count == 0).
      required:
        - count
      properties:
        medianDays:
          type: number
          format: double
          nullable: true
          example: 3.0
        meanDays:
          type: number
          format: double
          nullable: true
          example: 8.2
        count:
          type: integer
          format: int32
          example: 12

    WorkBalance:
      type: object
      description: Баланс работы — дефекты (firefighting) vs разработка+задачи (building). Доли в [0..1].
      required:
        - defectCount
        - buildCount
        - defectShare
        - buildShare
      properties:
        defectCount:
          type: integer
          format: int32
          example: 95
        buildCount:
          type: integer
          format: int32
          example: 5
        defectShare:
          type: number
          format: double
          example: 0.95
        buildShare:
          type: number
          format: double
          example: 0.05
