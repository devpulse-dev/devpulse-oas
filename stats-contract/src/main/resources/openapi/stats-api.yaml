openapi: 3.0.3
info:
  title: DevPulse - Stats API
  version: 1.0.0
  description: API для получения статистики по разработчикам

servers:
  - url: http://localhost:8080/api/v2
    description: Локальный сервер разработки
  - url: https://api.devpulse.dev/api/v2
    description: Продакшн сервер

tags:
  - name: Stats
    description: Статистика по разработчикам

# Auth handled outside the contract (gateway / SSO). API exposes no
# operation-level security requirements.
security: []

paths:
  /stats/daily:
    get:
      tags:
        - Stats
      summary: Получить дневную статистику
      description: |
        Дневные агрегаты за период (по ключу email × date × repo).
        
        Здесь displayName/avatarUrl НЕ возвращаются — дневных записей много (тысячи за период), enrichment дорогой. 
        Если нужны профили — фронт может агрегировать по email на своей стороне и подтянуть из /dashboard или /users/{email}/profile.
      operationId: getDailyStats
      parameters:
        - $ref: 'shared.yaml#/components/parameters/PeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/PeriodTo'
      responses:
        '200':
          description: Дневная статистика
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'shared.yaml#/components/schemas/DailyStats'
              example:
                - id: 12345
                  email: "boris@x5.ru"
                  date: "2026-05-10"
                  repo: "xrg-core"
                  commits: 3
                  mergeCommits: 0
                  addedLines: 124
                  deletedLines: 58
                  testAddedLines: 22
                  lastUpdated: "2026-05-10T01:02:15"
                  userId: 42
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /stats/weekly:
    get:
      tags:
        - Stats
      summary: Получить недельную статистику
      description: |
        Группировка по ISO-неделям, для каждой недели — totals и per-author breakdown с enriched displayName/avatarUrl. 
        Список отсортирован по возрастанию weekStart.
      operationId: getWeeklyStats
      parameters:
        - $ref: 'shared.yaml#/components/parameters/PeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/PeriodTo'
      responses:
        '200':
          description: Недельная статистика
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'shared.yaml#/components/schemas/WeeklyStats'
              example:
                - year: 2026
                  week: 19
                  weekStart: "2026-05-04"
                  totalCommits: 47
                  totalMergeCommits: 3
                  totalAddedLines: 1820
                  totalDeletedLines: 850
                  totalTestAddedLines: 320
                  authors:
                    - email: "boris@x5.ru"
                      displayName: "Boris"
                      avatarUrl: "https://kaiten.x5.ru/.../avatar.png"
                      commits: 12
                      nonMergeCommits: 11
                      mergeCommits: 1
                      addedLines: 480
                      deletedLines: 200
                      testAddedLines: 90
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /stats/summary:
    get:
      tags:
        - Stats
      summary: Получить сводку за период
      description: |
        Сводка за период: totals + топ-10 авторов с enriched displayName/avatarUrl. 
        Топ отсортирован по убыванию всех коммитов (включая мерджи) — это исторически так, для top-N это менее критично чем для дашборда.
      operationId: getSummaryStats
      parameters:
        - $ref: 'shared.yaml#/components/parameters/PeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/PeriodTo'
      responses:
        '200':
          description: Сводка за период
          content:
            application/json:
              schema:
                $ref: 'shared.yaml#/components/schemas/PeriodSummary'
              example:
                from: "2026-05-01"
                to: "2026-05-31"
                totalCommits: 312
                totalMergeCommits: 18
                totalAddedLines: 12400
                totalDeletedLines: 5800
                totalTestAddedLines: 2120
                uniqueAuthors: 14
                topAuthors:
                  - email: "boris@x5.ru"
                    displayName: "Boris"
                    avatarUrl: "https://kaiten.x5.ru/.../avatar.png"
                    commits: 47
                    nonMergeCommits: 44
                    mergeCommits: 3
                    addedLines: 1820
                    deletedLines: 850
                    testAddedLines: 320
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'
