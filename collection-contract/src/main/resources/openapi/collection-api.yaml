openapi: 3.0.3
info:
  title: DevPulse - Collection API
  version: 1.1.0
  description: API для управления сбором данных из Git и Kaiten

servers:
  - url: http://localhost:8080/api/v2
    description: Локальный сервер разработки
  - url: https://api.devpulse.dev/api/v2
    description: Продакшн сервер

tags:
  - name: Collection
    description: Управление сбором данных

# Auth handled outside the contract (gateway / SSO). API exposes no
# operation-level security requirements.
security: []

paths:
  /collection/runs:
    post:
      tags:
        - Collection
      summary: Запустить сбор данных
      description: |
        Запускает полный цикл сбора: git → daily stats → (изолированно) sync Kaiten users
        (обновление kaitenId/avatarUrl в unified_user). Карточки Kaiten НЕ выкачиваются —
        они тянутся live при открытии профиля. Синхронный — отдаёт уже финальный результат
        (SUCCESS или FAILED).

        Один сбор за раз: распределённый mutex через PostgreSQL pg_try_advisory_lock.
        Если в момент запроса уже идёт другой прогон — сразу возвращается 409, без ожидания.
      operationId: startCollectionRun
      requestBody:
        description: Опциональные параметры запуска сбора
        content:
          application/json:
            schema:
              $ref: 'shared.yaml#/components/schemas/CollectionRunRequest'
            example:
              since: "2026-05-10T00:00:00"
        required: false
      responses:
        '200':
          description: Прогон сбора запущен и завершён
          content:
            application/json:
              schema:
                $ref: 'shared.yaml#/components/schemas/CollectionRun'
              example:
                id: "f1a4c0d2-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
                startedAt: "2026-05-23T14:00:00"
                finishedAt: "2026-05-23T14:00:42"
                sinceDate: "2026-05-10T00:00:00"
                untilDate: "2026-05-23T14:00:00"
                status: "SUCCESS"
                errorMessage: null
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '409':
          description: |
            Сбор уже идёт. Распределённый mutex через pg_try_advisory_lock не пускает
            параллельный POST. Клиент может опросить GET /collection/runs/{id} для
            текущего прогона или повторить запрос после его завершения.
          content:
            application/problem+json:
              schema:
                $ref: 'shared.yaml#/components/schemas/ProblemDetails'
              example:
                type: "urn:devpulse:problem:conflict"
                title: "Collection already running"
                status: 409
                detail: "Another collection run is in progress. Wait for it to finish or query its status via GET /api/v2/collection/runs/{id}."
                instance: "/api/v2/collection/runs"
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /collection/runs/{id}:
    get:
      tags:
        - Collection
      summary: Получить статус прогона сбора
      description: Опрос статуса прогона по UUID
      operationId: getCollectionRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: 'shared.yaml#/components/schemas/Uuid'
          description: ID прогона сбора
      responses:
        '200':
          description: Статус прогона сбора
          content:
            application/json:
              schema:
                $ref: 'shared.yaml#/components/schemas/CollectionRun'
              example:
                id: "f1a4c0d2-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
                startedAt: "2026-05-23T14:00:00"
                finishedAt: "2026-05-23T14:00:42"
                sinceDate: "2026-05-10T00:00:00"
                untilDate: "2026-05-23T14:00:00"
                status: "SUCCESS"
                errorMessage: null
        '404':
          $ref: 'shared.yaml#/components/responses/NotFound'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /collection/runs/{id}/cancel:
    post:
      tags:
        - Collection
      summary: Отменить идущий прогон сбора
      description: |
        Кооперативная отмена: ставит флаг отмены на прогон. Идущий сбор останавливается
        в ближайшей безопасной точке (между репозиториями / фазами), помечается CANCELLED,
        advisory-lock освобождается. Отмена **асинхронна** — сразу 202, финальный статус
        наблюдать через GET /collection/runs/{id} (RUNNING → CANCELLED).

        Консистентность как у FAILED: курсор не двигается, daily_stats может быть временно
        неполным — следующий сбор доберёт недостающее (mark-and-sweep + recompute).
      operationId: cancelCollectionRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: 'shared.yaml#/components/schemas/Uuid'
          description: ID прогона для отмены
      responses:
        '202':
          description: Отмена запрошена; прогон остановится в ближайшей safe-точке
          content:
            application/json:
              schema:
                $ref: 'shared.yaml#/components/schemas/CollectionRun'
              example:
                id: "f1a4c0d2-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
                startedAt: "2026-05-23T14:00:00"
                finishedAt: null
                sinceDate: "2026-05-10T00:00:00"
                untilDate: "2026-05-23T14:00:00"
                status: "RUNNING"
                errorMessage: null
        '404':
          $ref: 'shared.yaml#/components/responses/NotFound'
        '409':
          description: |
            Прогон уже в терминальном статусе (SUCCESS / FAILED / CANCELLED) — отменять нечего.
          content:
            application/problem+json:
              schema:
                $ref: 'shared.yaml#/components/schemas/ProblemDetails'
              example:
                type: "urn:devpulse:problem:conflict"
                title: "Collection run not cancellable"
                status: 409
                detail: "Run is already in a terminal state (SUCCESS/FAILED/CANCELLED)."
                instance: "/api/v2/collection/runs/f1a4c0d2-5e6f-7a8b-9c0d-1e2f3a4b5c6d/cancel"
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'
