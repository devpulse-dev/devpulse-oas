name: 🚀 Deploy Contracts

# Lockstep-релиз (Approach A): весь contracts-репо едет под одной версией
# (parent pom <revision>). Деплоит parent + 6 Maven-модулей + npm api-types за раз.
# Версию бампать в pom.xml → <revision>.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # ─────────────────────────── Maven (backend JARs) ───────────────────────────
      # Один root-деплой: реактор сам ставит shared-contract первым (он зависимость
      # остальных) и публикует parent pom (нужен потребителям для резолва дочерних).

      - name: Deploy Maven contracts (parent + 6 modules)
        run: |
          REVISION=$(mvn -q -N help:evaluate -Dexpression=revision -DforceStdout)
          echo "📦 Deploying DevPulse contracts v${REVISION} (lockstep)..."
          mvn -B clean deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────────────── npm (frontend api-types) ──────────────────────────
      # Единый пакет @devpulse-dev/api-types на весь /api/v2. Версия деривится из
      # того же pom <revision> (build-types.mjs синхронизирует package.json).
      # Идемпотентно: если версия уже в registry — publish пропускается.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@devpulse-dev'

      - name: Publish frontend api-types (npm)
        run: |
          cd api-types
          npm install --no-audit --no-fund
          npm run build            # генерит dist/ + синхронит package.json version из pom <revision>
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@devpulse-dev/api-types@${VERSION}" version >/dev/null 2>&1; then
            echo "⏭️  @devpulse-dev/api-types@${VERSION} уже опубликован — пропускаю (бампни <revision> для релиза)."
          else
            echo "📦 Publishing @devpulse-dev/api-types@${VERSION}..."
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Success summary
        run: |
          REVISION=$(node -p "require('./api-types/package.json').version")
          echo "✅ DEPLOYMENT SUCCESSFUL — DevPulse contracts v${REVISION}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "📅 $(date)"
          echo ""
          echo "📊 Packages: https://github.com/devpulse-dev/devpulse-oas/packages"
          echo "🔧 Maven (backend): com.devpulse:{shared,collection,dashboard,stats,users,kaiten}-contract:${REVISION}"
          echo "⚛️  npm (frontend):  @devpulse-dev/api-types@${REVISION}"
