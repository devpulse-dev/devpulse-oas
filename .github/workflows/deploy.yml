name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build all modules
        run: |
          for module in shared-contract collection-contract dashboard-contract stats-contract users-contract kaiten-contract; do
            echo "Building $module"
            cd $module
            mvn clean install -DskipTests
            cd ..
          done

      - name: Validate OpenAPI specs
        run: |
          # Установка swagger-cli для валидации
          curl -L https://github.com/swagger-api/swagger-cli/releases/download/v2.1.9/swagger-cli-linux.jar -o swagger-cli.jar
          
          # Валидация всех спецификаций
          for spec in $(find . -name "*.yaml" -path "*/openapi/*"); do
            echo "Validating $spec"
            java -jar swagger-cli.jar validate "$spec"
          done

  deploy:
    name: Deploy to GitHub Packages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Deploy all modules
        run: |
          for module in shared-contract collection-contract dashboard-contract stats-contract users-contract kaiten-contract; do
            echo "Deploying $module"
            cd $module
            mvn clean deploy
            cd ..
          done
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
