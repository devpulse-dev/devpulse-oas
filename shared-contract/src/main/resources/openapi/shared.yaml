openapi: 3.0.3
info:
  title: Markable Dev Analytics - Shared Components
  version: 1.0.0
  description: Общие схемы и компоненты для всех API модулей

components:
  schemas:
    # Общие типы
    Uuid:
      type: string
      format: uuid
      description: Уникальный идентификатор в формате UUID
      example: "f1a4c0d2-5e6f-7a8b-9c0d-1e2f3a4b5c6d"

    DateTime:
      type: string
      format: date-time
      description: Дата и время в ISO 8601 формате
      example: "2026-05-23T14:00:00"

    Date:
      type: string
      format: date
      description: Дата в ISO 8601 формате (YYYY-MM-DD)
      example: "2026-05-23"

    Email:
      type: string
      format: email
      description: Email адрес
      example: "boris@x5.ru"

    # RFC 7807 Problem Details
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: URI идентификатор типа ошибки
          example: "urn:markable:problem:bad-request"
        title:
          type: string
          description: Краткое описание ошибки
          example: "Bad request"
        status:
          type: integer
          format: int32
          description: HTTP статус код
          example: 400
        detail:
          type: string
          description: Подробное описание ошибки
          example: "period.to (2026-05-01) is before period.from (2026-05-31)"
        instance:
          type: string
          format: uri
          description: URI запроса, который вызвал ошибку
          example: "/api/v2/users/boris@x5.ru/profile"

    # Период
    Period:
      type: object
      required:
        - from
        - to
      properties:
        from:
          $ref: '#/components/schemas/Date'
        to:
          $ref: '#/components/schemas/Date'

    # Пагинация
    PageRequest:
      type: object
      properties:
        page:
          type: integer
          format: int32
          default: 0
          minimum: 0
          description: Номер страницы (0-based)
        size:
          type: integer
          format: int32
          default: 50
          minimum: 1
          maximum: 500
          description: Размер страницы

    PageResponse:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          description: Содержимое страницы
        page:
          type: integer
          format: int32
          description: Текущий номер страницы
        size:
          type: integer
          format: int32
          description: Размер страницы
        totalElements:
          type: integer
          format: int64
          description: Общее количество элементов
        totalPages:
          type: integer
          format: int32
          description: Общее количество страниц

  # Security схемы
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен для аутентификации

    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API ключ для доступа

  # Общие параметры
  parameters:
    PeriodFrom:
      name: from
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Date'
      description: Начало периода (включительно)
      example: "2026-05-01"

    PeriodTo:
      name: to
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Date'
      description: Конец периода (включительно)
      example: "2026-05-31"

    OptionalPeriodFrom:
      name: from
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Date'
      description: Начало периода (включительно), опционально
      example: "2026-05-01"

    OptionalPeriodTo:
      name: to
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Date'
      description: Конец периода (включительно), опционально
      example: "2026-05-31"

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
      description: Номер страницы (0-based)

    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 500
      description: Размер страницы

  # Общие ответы
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "urn:markable:problem:bad-request"
            title: "Bad request"
            status: 400
            detail: "period.to (2026-05-01) is before period.from (2026-05-31)"
            instance: "/api/v2/users/boris@x5.ru/profile"

    NotFound:
      description: Ресурс не найден

    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "urn:markable:problem:internal"
            title: "Internal server error"
            status: 500
            detail: "Unexpected error occurred"
            instance: "/api/v2/stats/daily"
