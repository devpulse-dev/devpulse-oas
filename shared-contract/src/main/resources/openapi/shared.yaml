openapi: 3.0.3
info:
  title: DevPulse - Shared Components
  version: 1.0.0
  description: |
    Общие схемы и компоненты для всех API модулей. Это не самостоятельный API —
    модуль используется только как target для $ref из остальных контрактов
    (`shared.yaml#/components/...`).

# Заглушки, требуемые спецификацией OpenAPI 3.0.3 — реальных эндпоинтов в этом
# модуле нет, он публикует только компоненты.
servers:
  - url: /
    description: Not a real API — components library
paths: {}

components:
  schemas:
    # Общие типы
    Uuid:
      type: string
      format: uuid
      description: Уникальный идентификатор в формате UUID
      example: "f1a4c0d2-5e6f-7a8b-9c0d-1e2f3a4b5c6d"

    DateTime:
      type: string
      format: date-time
      description: Дата и время в ISO 8601 формате
      example: "2026-05-23T14:00:00"

    Date:
      type: string
      format: date
      description: Дата в ISO 8601 формате (YYYY-MM-DD)
      example: "2026-05-23"

    Email:
      type: string
      format: email
      description: Email адрес
      example: "boris@x5.ru"

    # RFC 7807 Problem Details
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: URI идентификатор типа ошибки
          example: "urn:devpulse:problem:bad-request"
        title:
          type: string
          description: Краткое описание ошибки
          example: "Bad request"
        status:
          type: integer
          format: int32
          description: HTTP статус код
          example: 400
        detail:
          type: string
          description: Подробное описание ошибки
          example: "period.to (2026-05-01) is before period.from (2026-05-31)"
        instance:
          type: string
          format: uri
          description: URI запроса, который вызвал ошибку
          example: "/api/v2/users/boris@x5.ru/profile"

    # Период
    Period:
      type: object
      required:
        - from
        - to
      properties:
        from:
          $ref: '#/components/schemas/Date'
        to:
          $ref: '#/components/schemas/Date'

    # Пагинация
    PageRequest:
      type: object
      properties:
        page:
          type: integer
          format: int32
          default: 0
          minimum: 0
          description: Номер страницы (0-based)
        size:
          type: integer
          format: int32
          default: 50
          minimum: 1
          maximum: 500
          description: Размер страницы

    PageResponse:
      type: object
      description: |
        Generic paginated wrapper. Не используется напрямую в текущих эндпоинтах
        (каждый домен расписывает свой <DomainResponse> с конкретным items[]),
        оставлен как шаблон для будущих paginated ручек.
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          description: Содержимое страницы
          items:
            type: object
            description: Любая модель домена. Подменяется конкретным типом при наследовании.
        page:
          type: integer
          format: int32
          description: Текущий номер страницы
        size:
          type: integer
          format: int32
          description: Размер страницы
        totalElements:
          type: integer
          format: int64
          description: Общее количество элементов
        totalPages:
          type: integer
          format: int32
          description: Общее количество страниц

    # Автор с агрегированной статистикой
    AuthorSummary:
      type: object
      required:
        - email
        - commits
        - mergeCommits
        - nonMergeCommits
        - addedLines
        - deletedLines
        - testAddedLines
      properties:
        email:
          $ref: '#/components/schemas/Email'
        displayName:
          type: string
          nullable: true
          description: Отображаемое имя пользователя из Kaiten
          example: "Boris"
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: URL аватара пользователя из Kaiten
          example: "https://kaiten.x5.ru/avatars/42.png"
        commits:
          type: integer
          format: int64
          description: |
            Общее количество коммитов (включая мерджи).
            int64 — потому что на больших monorepo'ах за длинный период значения могут
            превысить 2^31. См. OAS-2 review в devpulse README.
          example: 50
        mergeCommits:
          type: integer
          format: int64
          description: Количество мердж-коммитов
          example: 5
        nonMergeCommits:
          type: integer
          format: int64
          description: Количество не-мердж коммитов (commits - mergeCommits)
          example: 45
        addedLines:
          type: integer
          format: int64
          description: Количество добавленных строк
          example: 1820
        deletedLines:
          type: integer
          format: int64
          description: Количество удалённых строк
          example: 850
        testAddedLines:
          type: integer
          format: int64
          description: Количество добавленных строк в тестах
          example: 320
        activity:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ActivityScore'
          description: |
            Композитная метрика активности. Заполнена только на /dashboard
            (по ней идёт сортировка). На /stats/weekly и /stats/summary — всегда null.
            На /stats/daily используется другой тип (DailyStats), где этого поля нет.

    # Activity Score — композитная метрика активности для дашборда
    ActivityScore:
      type: object
      required:
        - score
        - category
        - volumeFactor
        - qualityFactor
        - avgLinesPerCommit
      properties:
        score:
          type: number
          format: double
          description: |
            Финальный score: volumeFactor × qualityFactor.
            1.0 ≈ норма команды. Используется для сортировки на /dashboard.
          example: 0.92
        category:
          type: string
          enum: [INACTIVE, BELOW_AVERAGE, ACTIVE, STAR]
          description: |
            Категория активности по порогам score:
              - INACTIVE: score < 0.2
              - BELOW_AVERAGE: 0.2 ≤ score < 0.6
              - ACTIVE: 0.6 ≤ score < 1.5
              - STAR: score ≥ 1.5
          example: "ACTIVE"
        volumeFactor:
          type: number
          format: double
          description: |
            Объём активности: nonMergeCommits / expectedCommits.
            Baseline expectedCommits = 50 коммитов / 30 дней, масштабируется под
            длину запрошенного периода. Настраивается на бэке через
            scoring.expected-commits-per-30-days в application.yml.
          example: 0.92
        qualityFactor:
          type: number
          format: double
          minimum: 0.3
          maximum: 1.0
          description: |
            Качество коммитов: 0.3..1.0 от среднего числа строк на коммит.
              - 10..200 строк/коммит = 1.0 (здорово)
              - < 5 строк = штраф (микро-коммиты)
              - > 500 строк = штраф (бомбы)
          example: 1.0
        avgLinesPerCommit:
          type: number
          format: double
          description: Среднее число строк на коммит за период (для тултипа на фронте)
          example: 47.5

    # Прогон сбора данных
    CollectionRun:
      type: object
      required:
        - id
        - startedAt
        - finishedAt
        - sinceDate
        - untilDate
        - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        startedAt:
          $ref: '#/components/schemas/DateTime'
        finishedAt:
          $ref: '#/components/schemas/DateTime'
        sinceDate:
          $ref: '#/components/schemas/DateTime'
        untilDate:
          $ref: '#/components/schemas/DateTime'
        status:
          type: string
          enum: [RUNNING, SUCCESS, FAILED]
          description: Статус прогона сбора
        errorMessage:
          type: string
          nullable: true
          description: Сообщение об ошибке (если status = FAILED)

    # Запрос на запуск сбора
    CollectionRunRequest:
      type: object
      properties:
        since:
          type: string
          format: date-time
          nullable: true
          description: Момент начала периода. Если опущено или null - берётся точка из последнего успешного прогона
          example: "2026-05-10T00:00:00"

    # Профиль пользователя
    UserProfile:
      type: object
      description: |
        Запись unified_user. id и email — единственные гарантированно non-null поля
        (естественные ключи). username/name/avatarUrl/kaitenId/gitlabId — nullable,
        потому что у автора без Kaiten-учётки они пустые (внешний контрибьютор,
        сервисный аккаунт, ещё не прошла синхронизация).
      required:
        - id
        - email
      properties:
        id:
          type: integer
          format: int64
          description: ID пользователя в системе
          example: 42
        email:
          $ref: '#/components/schemas/Email'
        username:
          type: string
          nullable: true
          description: |
            Имя пользователя из Kaiten. null, если автор не связан с Kaiten
            (внешний контрибьютор / сервисный аккаунт) — фронт должен
            использовать email или часть до @ как fallback.
          example: "boris"
        name:
          type: string
          nullable: true
          description: Полное имя пользователя
          example: "Boris"
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: URL аватара пользователя
          example: "https://kaiten.x5.ru/avatars/42.png"
        kaitenId:
          type: integer
          format: int64
          nullable: true
          description: ID пользователя в Kaiten
          example: 7
        gitlabId:
          type: integer
          format: int64
          nullable: true
          description: ID пользователя в GitLab
          example: null
        team:
          type: string
          nullable: true
          description: |
            Команда пользователя. Назначается через фронт (PUT /users/{email}/team).
            null, если команда не задана. Свободный текст (без справочника команд в v1).
          example: "Platform"

    # Коммит
    Commit:
      type: object
      required:
        - hash
        - authorEmail
        - commitDate
        - merge
        - addedLines
        - deletedLines
        - testAddedLines
        - message
        - repo
      properties:
        hash:
          type: string
          description: Хеш коммита
          example: "a1b2c3d4e5f67890abcdef1234567890abcdef12"
        authorEmail:
          $ref: '#/components/schemas/Email'
        commitDate:
          $ref: '#/components/schemas/DateTime'
        merge:
          type: boolean
          description: Является ли коммитом мерджем
          example: false
        addedLines:
          type: integer
          format: int64
          description: Количество добавленных строк
          example: 42
        deletedLines:
          type: integer
          format: int64
          description: Количество удалённых строк
          example: 7
        testAddedLines:
          type: integer
          format: int64
          description: Количество добавленных строк в тестах
          example: 12
        message:
          type: string
          description: Сообщение коммита
          example: "12345 fix the bug"
        taskNumber:
          type: string
          nullable: true
          description: Номер задачи из сообщения коммита
          example: "12345"
        repo:
          type: string
          description: Название репозитория
          example: "xrg-core"

    # Карточка Kaiten
    KaitenCard:
      type: object
      required:
        - id
        - title
        - typeId
        - cardType
        - columnType
        - columnStatus
        - columnTitle
        - boardName
        - spaceName
        - ownerId
        - ownerName
        - createdAt
        - updatedAt
        - archived
        - closed
        - url
        - memberIds
      properties:
        id:
          type: integer
          format: int64
          description: ID карточки Kaiten
          example: 12345
        title:
          type: string
          description: Заголовок карточки
          example: "Fix the bug"
        description:
          type: string
          nullable: true
          description: Описание карточки
          example: "..."
        typeId:
          type: integer
          format: int64
          description: Сырой id типа карточки в Kaiten (значение поля type_id из Kaiten API)
          example: 70
        cardType:
          type: string
          enum: [DEVELOPMENT, DEFECT, OTHER]
          description: |
            Наша классификация типа карточки, derived из typeId:
              - DEVELOPMENT — typeId == 70
              - DEFECT — typeId == 8
              - OTHER — всё остальное
          example: "DEVELOPMENT"
        columnType:
          type: integer
          format: int32
          description: Сырой код колонки из Kaiten API (column.type), значения 1/2/3
          example: 2
        columnStatus:
          type: string
          enum: [NEW, IN_PROGRESS, DONE, UNKNOWN]
          description: |
            Статус задачи, derived из columnType:
              - NEW — columnType == 1
              - IN_PROGRESS — columnType == 2
              - DONE — columnType == 3
              - UNKNOWN — иное значение
          example: "IN_PROGRESS"
        columnTitle:
          type: string
          description: Человекочитаемое название колонки (значение column.title из Kaiten API)
          example: "В уточнении"
        boardName:
          type: string
          description: Название доски
          example: "Core"
        spaceName:
          type: string
          description: Название пространства
          example: "Engineering"
        ownerId:
          type: integer
          format: int64
          description: ID владельца карточки
          example: 7
        ownerName:
          type: string
          description: Имя владельца карточки
          example: "Boris"
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: Момент закрытия карточки. null, если карточка не закрыта.
        archived:
          type: boolean
          description: |
            Карточка скрыта на доске. ВАЖНО: archived НЕ значит «задача завершена» — это
            просто видимость на доске. Для определения «закрыта/нет» используйте поле
            closed (или columnStatus == DONE), НЕ archived.
          example: false
        closed:
          type: boolean
          description: |
            Производное поле: closed = (columnStatus == DONE) || (closedAt != null).
            Канонический способ узнать «закрыта ли задача».
          example: false
        url:
          type: string
          format: uri
          description: URL карточки в Kaiten
          example: "https://kaiten.x5.ru/12345"
        memberIds:
          type: array
          items:
            type: integer
            format: int64
          description: ID участников карточки
          example: [7]

    # Сводка статистики пользователя
    UserStatsSummary:
      type: object
      required:
        - email
        - commits
        - mergeCommits
        - addedLines
        - deletedLines
        - testAddedLines
      properties:
        email:
          $ref: '#/components/schemas/Email'
        commits:
          type: integer
          format: int64
          description: Общее количество коммитов
          example: 47
        mergeCommits:
          type: integer
          format: int64
          description: Количество мердж-коммитов
          example: 3
        addedLines:
          type: integer
          format: int64
          description: Количество добавленных строк
          example: 1820
        deletedLines:
          type: integer
          format: int64
          description: Количество удалённых строк
          example: 850
        testAddedLines:
          type: integer
          format: int64
          description: Количество добавленных строк в тестах
          example: 320

    # Дневная статистика
    DailyStats:
      type: object
      required:
        - id
        - email
        - date
        - repo
        - commits
        - mergeCommits
        - addedLines
        - deletedLines
        - testAddedLines
        - lastUpdated
        - userId
      properties:
        id:
          type: integer
          format: int64
          description: ID записи
          example: 12345
        email:
          $ref: '#/components/schemas/Email'
        date:
          $ref: '#/components/schemas/Date'
        repo:
          type: string
          description: Название репозитория
          example: "xrg-core"
        commits:
          type: integer
          format: int64
          description: Количество коммитов
          example: 3
        mergeCommits:
          type: integer
          format: int64
          description: Количество мердж-коммитов
          example: 0
        addedLines:
          type: integer
          format: int64
          description: Количество добавленных строк
          example: 124
        deletedLines:
          type: integer
          format: int64
          description: Количество удалённых строк
          example: 58
        testAddedLines:
          type: integer
          format: int64
          description: Количество добавленных строк в тестах
          example: 22
        lastUpdated:
          $ref: '#/components/schemas/DateTime'
        userId:
          type: integer
          format: int64
          description: ID пользователя
          example: 42

    # Недельная статистика
    WeeklyStats:
      type: object
      required:
        - year
        - week
        - weekStart
        - totalCommits
        - totalMergeCommits
        - totalAddedLines
        - totalDeletedLines
        - totalTestAddedLines
        - authors
      properties:
        year:
          type: integer
          format: int32
          description: Год
          example: 2026
        week:
          type: integer
          format: int32
          description: Номер недели по ISO
          example: 19
        weekStart:
          $ref: '#/components/schemas/Date'
        totalCommits:
          type: integer
          format: int64
          description: Общее количество коммитов за неделю
          example: 47
        totalMergeCommits:
          type: integer
          format: int64
          description: Общее количество мердж-коммитов за неделю
          example: 3
        totalAddedLines:
          type: integer
          format: int64
          description: Общее количество добавленных строк за неделю
          example: 1820
        totalDeletedLines:
          type: integer
          format: int64
          description: Общее количество удалённых строк за неделю
          example: 850
        totalTestAddedLines:
          type: integer
          format: int64
          description: Общее количество добавленных строк в тестах за неделю
          example: 320
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorSummary'
          description: Статистика по авторам за неделю

    # Сводка за период
    PeriodSummary:
      type: object
      required:
        - from
        - to
        - totalCommits
        - totalMergeCommits
        - totalAddedLines
        - totalDeletedLines
        - totalTestAddedLines
        - uniqueAuthors
        - topAuthors
      properties:
        from:
          $ref: '#/components/schemas/Date'
        to:
          $ref: '#/components/schemas/Date'
        totalCommits:
          type: integer
          format: int64
          description: Общее количество коммитов за период
          example: 312
        totalMergeCommits:
          type: integer
          format: int64
          description: Общее количество мердж-коммитов за период
          example: 18
        totalAddedLines:
          type: integer
          format: int64
          description: Общее количество добавленных строк за период
          example: 12400
        totalDeletedLines:
          type: integer
          format: int64
          description: Общее количество удалённых строк за период
          example: 5800
        totalTestAddedLines:
          type: integer
          format: int64
          description: Общее количество добавленных строк в тестах за период
          example: 2120
        uniqueAuthors:
          type: integer
          format: int32
          description: Количество уникальных авторов за период
          example: 14
        topAuthors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorSummary'
          description: Топ авторов за период

    # Почасовая активность: одна ячейка матрицы weekday × hour
    HourlyCell:
      type: object
      required:
        - weekday
        - hour
        - commits
      properties:
        weekday:
          type: integer
          format: int32
          minimum: 0
          maximum: 6
          description: День недели по ISO — 0=Пн, 1=Вт … 6=Вс
          example: 2
        hour:
          type: integer
          format: int32
          minimum: 0
          maximum: 23
          description: Час суток (локальное время сервера сбора), 0..23
          example: 14
        commits:
          type: integer
          format: int64
          description: Количество не-мердж коммитов в этой ячейке
          example: 7
        addedLines:
          type: integer
          format: int64
          description: Сумма добавленных строк в этой ячейке (опционально)
          example: 320

    # Почасовая статистика: плотная (или разреженная) матрица день-недели × час
    HourlyStats:
      type: object
      required:
        - from
        - to
        - cells
      properties:
        from:
          $ref: '#/components/schemas/Date'
        to:
          $ref: '#/components/schemas/Date'
        cells:
          type: array
          description: |
            Агрегаты по ключу (weekday, hour) за период. До 7×24 = 168 ячеек.
            Бэк может опускать пустые ячейки (commits = 0) — фронт достраивает
            полную сетку, отсутствующие ключи трактует как 0.
          items:
            $ref: '#/components/schemas/HourlyCell'

    # Ревью-метрики одного автора за период
    ReviewAuthor:
      type: object
      required:
        - email
        - reviewsGiven
        - commentsGiven
        - reviewsReceived
        - avgTimeToMergeHours
      properties:
        email:
          $ref: '#/components/schemas/Email'
        displayName:
          type: string
          nullable: true
          description: Отображаемое имя пользователя из Kaiten
          example: "Boris"
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: URL аватара пользователя из Kaiten
          example: "https://kaiten.x5.ru/avatars/42.png"
        reviewsGiven:
          type: integer
          format: int32
          description: |
            Сколько чужих MR автор отревьюил (нажал Approve) за период, distinct по MR.
            Свои MR не считаются.
          example: 23
        commentsGiven:
          type: integer
          format: int32
          description: |
            Сколько ревью-комментариев автор написал к чужим MR за период
            (не-системные заметки; свои MR не считаются). Объём, не distinct по MR.
          example: 47
        reviewsReceived:
          type: integer
          format: int32
          description: Сколько MR/PR этого автора были отревьюены другими
          example: 14
        avgTimeToMergeHours:
          type: number
          format: double
          description: Среднее время от открытия MR/PR автора до merge, в часах
          example: 18.5
        mergedMrCount:
          type: integer
          format: int32
          description: Сколько MR/PR автора были смержены за период (опционально)
          example: 11

    # Сводка ревью-метрик за период: баланс «пишу / ревьюю», время до merge
    ReviewStats:
      type: object
      required:
        - from
        - to
        - authors
      properties:
        from:
          $ref: '#/components/schemas/Date'
        to:
          $ref: '#/components/schemas/Date'
        authors:
          type: array
          description: Метрики ревью по авторам за период
          items:
            $ref: '#/components/schemas/ReviewAuthor'

    # Ответ на синхронизацию пользователей Kaiten
    KaitenSyncResponse:
      type: object
      required:
        - synced
      properties:
        synced:
          type: integer
          format: int32
          description: Количество синхронизированных пользователей
          example: 142

  # Security схемы
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен для аутентификации

    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API ключ для доступа

  # Общие параметры
  parameters:
    PeriodFrom:
      name: from
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Date'
      description: Начало периода (включительно)
      example: "2026-05-01"

    PeriodTo:
      name: to
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Date'
      description: Конец периода (включительно)
      example: "2026-05-31"

    OptionalPeriodFrom:
      name: from
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Date'
      description: Начало периода (включительно), опционально
      example: "2026-05-01"

    OptionalPeriodTo:
      name: to
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Date'
      description: Конец периода (включительно), опционально
      example: "2026-05-31"

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
      description: Номер страницы (0-based)

    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 500
      description: Размер страницы

  # Общие ответы
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "urn:devpulse:problem:bad-request"
            title: "Bad request"
            status: 400
            detail: "period.to (2026-05-01) is before period.from (2026-05-31)"
            instance: "/api/v2/users/boris@x5.ru/profile"

    NotFound:
      description: Ресурс не найден

    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "urn:devpulse:problem:internal"
            title: "Internal server error"
            status: 500
            detail: "Unexpected error occurred"
            instance: "/api/v2/stats/daily"
