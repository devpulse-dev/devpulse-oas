openapi: 3.0.3
info:
  title: DevPulse - Dashboard API
  version: 1.0.0
  description: API для дашборда с активностью разработчиков

servers:
  - url: http://localhost:8080/api/v2
    description: Локальный сервер разработки
  - url: https://api.devpulse.dev/api/v2
    description: Продакшн сервер

tags:
  - name: Dashboard
    description: Дашборд с активностью разработчиков

# Auth handled outside the contract (gateway / SSO). API exposes no
# operation-level security requirements.
security: []

paths:
  /dashboard:
    get:
      tags:
        - Dashboard
      summary: Получить данные дашборда
      description: |
        Главный борд: paginated список всех активных авторов за период (имеющих ≥ 1 коммит).
        Отсортирован по убыванию activity.score — композитной метрики (см. ActivityScore
        в shared.yaml). Только на этом эндпоинте AuthorSummary.activity заполнен —
        на /stats/weekly и /stats/summary он всегда null.

        Если from/to опущены — бэк подставляет последние 30 дней (today-30..today).

        Фронт может показать первую страницу как «топ», а последнюю — как «аутсайдеры»
        (или фильтровать по activity.category in {INACTIVE, BELOW_AVERAGE}). Раздельных
        секций в API больше нет — один list + pagination.
      operationId: getDashboard
      parameters:
        - $ref: 'shared.yaml#/components/parameters/OptionalPeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/OptionalPeriodTo'
        - $ref: 'shared.yaml#/components/parameters/Page'
        - $ref: 'shared.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Данные дашборда
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
              example:
                from: "2026-04-23"
                to: "2026-05-23"
                page: 0
                size: 20
                totalElements: 47
                totalPages: 3
                hasNext: true
                items:
                  - email: "boris@x5.ru"
                    displayName: "Boris"
                    avatarUrl: "https://kaiten.x5.ru/.../avatar.png"
                    commits: 50
                    nonMergeCommits: 45
                    mergeCommits: 5
                    addedLines: 1820
                    deletedLines: 850
                    testAddedLines: 320
                    activity:
                      score: 0.92
                      category: "ACTIVE"
                      volumeFactor: 0.92
                      qualityFactor: 1.0
                      avgLinesPerCommit: 47.5
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

components:
  schemas:
    DashboardResponse:
      type: object
      required:
        - from
        - to
        - page
        - size
        - totalElements
        - totalPages
        - hasNext
        - items
      properties:
        from:
          $ref: 'shared.yaml#/components/schemas/Date'
          description: Начало периода
        to:
          $ref: 'shared.yaml#/components/schemas/Date'
          description: Конец периода
        page:
          type: integer
          format: int32
          description: Текущий номер страницы (0-based)
          example: 0
        size:
          type: integer
          format: int32
          description: Размер страницы
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Общее количество авторов
          example: 47
        totalPages:
          type: integer
          format: int32
          description: Общее количество страниц
          example: 3
        hasNext:
          type: boolean
          description: Есть ли следующая страница
          example: true
        items:
          type: array
          description: Список авторов на текущей странице
          items:
            $ref: 'shared.yaml#/components/schemas/AuthorSummary'
