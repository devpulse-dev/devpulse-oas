# Конфиг для `redocly lint` (CI + локально).
extends:
  - recommended
rules:
  # Каждый спек линтится отдельным файлом; shared.yaml сам по себе выглядит так,
  # будто часть компонентов «не используется» — хотя их потребляют доменные спеки
  # через `$ref`. Это false-positive при per-file линте, глушим.
  no-unused-components: off
  # У нас осознанно нет лицензии в info и серверы указывают на localhost/прод-плейсхолдер —
  # это не повод падать. Оставляем как мягкие напоминания, не ошибки.
  info-license: off
  no-server-example.com: warn
