openapi: 3.0.3
info:
  title: DevPulse - Kaiten API
  version: 1.0.0
  description: API для интеграции с Kaiten

servers:
  - url: http://localhost:8080/api/v2
    description: Локальный сервер разработки
  - url: https://api.devpulse.dev/api/v2
    description: Продакшн сервер

tags:
  - name: Kaiten
    description: Интеграция с Kaiten

# Auth handled outside the contract (gateway / SSO). API exposes no
# operation-level security requirements.
security: []

paths:
  /kaiten/sync-users:
    post:
      tags:
        - Kaiten
      summary: Синхронизировать пользователей Kaiten
      description: |
        Тянет всех пользователей из Kaiten API и bulk-upsert-ит в kaiten_user. 
        Используется как ручной триггер, если расписание сбора пропустило обновления.
      operationId: syncKaitenUsers
      responses:
        '200':
          description: Пользователи синхронизированы
          content:
            application/json:
              schema:
                $ref: 'shared.yaml#/components/schemas/KaitenSyncResponse'
              example:
                synced: 142
        '502':
          description: |
            Upstream Kaiten API недоступен или вернул ошибку. Бэк не смог завершить sync.
            Стоит повторить запрос позже.
          content:
            application/problem+json:
              schema:
                $ref: 'shared.yaml#/components/schemas/ProblemDetails'
              example:
                type: "urn:devpulse:problem:upstream-error"
                title: "Upstream service error"
                status: 502
                detail: "Kaiten API returned 503 — sync aborted, no partial state persisted."
                instance: "/api/v2/kaiten/sync-users"
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'
