openapi: 3.0.3
info:
  title: DevPulse - Users API
  version: 1.0.0
  description: API для работы с профилями пользователей и их коммитами

servers:
  - url: http://localhost:8080/api/v2
    description: Локальный сервер разработки
  - url: https://api.devpulse.dev/api/v2
    description: Продакшн сервер

tags:
  - name: Users
    description: Профили и коммиты пользователей

# Auth handled outside the contract (gateway / SSO). API exposes no
# operation-level security requirements.
security: []

paths:
  /users/{email}/profile:
    get:
      tags:
        - Users
      summary: Получить профиль пользователя
      description: |
        Профиль пользователя за период: запись в unified_user, агрегированный summary из
        daily stats, первые 500 коммитов и карточки Kaiten live (если у пользователя есть
        kaiten_id).

        Карточки Kaiten тянутся напрямую из Kaiten API (не из локальной БД), с Caffeine-
        кэшем TTL 5 минут. Успешный POST /collection/runs инвалидирует кэш. Фильтр на
        бэке: в cards[] остаются только карточки, по которым (а) есть коммит автора за
        период, ИЛИ (б) карточка не закрыта (columnStatus != DONE и closedAt == null).
        Закрытые карточки без коммитов автора отсеиваются.

        from/to опциональны — без них берётся последние 30 дней (основной кейс «открыть
        профиль с дашборда»).
      operationId: getUserProfile
      parameters:
        - name: email
          in: path
          required: true
          schema:
            $ref: 'shared.yaml#/components/schemas/Email'
          description: Email пользователя
        - $ref: 'shared.yaml#/components/parameters/OptionalPeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/OptionalPeriodTo'
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                user:
                  id: 42
                  email: "boris@x5.ru"
                  username: "boris"
                  name: "Boris"
                  avatarUrl: null
                  kaitenId: 7
                  gitlabId: null
                summary:
                  email: "boris@x5.ru"
                  commits: 47
                  mergeCommits: 3
                  addedLines: 1820
                  deletedLines: 850
                  testAddedLines: 320
                commits:
                  - hash: "a1b2c3d4..."
                    authorEmail: "boris@x5.ru"
                    commitDate: "2026-05-10T12:00:00"
                    merge: false
                    addedLines: 42
                    deletedLines: 7
                    testAddedLines: 12
                    message: "12345 fix the bug"
                    taskNumber: "12345"
                    repo: "xrg-core"
                cards:
                  - id: 12345
                    title: "Fix the bug"
                    description: "..."
                    typeId: 70
                    cardType: "DEVELOPMENT"
                    columnType: 2
                    columnStatus: "IN_PROGRESS"
                    columnTitle: "В уточнении"
                    boardName: "Core"
                    spaceName: "Engineering"
                    ownerId: 7
                    ownerName: "Boris"
                    createdAt: "2026-05-01T10:00:00"
                    updatedAt: "2026-05-10T12:00:00"
                    closedAt: null
                    archived: false
                    closed: false
                    url: "https://kaiten.x5.ru/12345"
                    memberIds: [7]
        '404':
          $ref: 'shared.yaml#/components/responses/NotFound'
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /users/{email}/commits:
    get:
      tags:
        - Users
      summary: Получить коммиты пользователя
      description: Коммиты пользователя за период с пагинацией
      operationId: getUserCommits
      parameters:
        - name: email
          in: path
          required: true
          schema:
            $ref: 'shared.yaml#/components/schemas/Email'
          description: Email пользователя
        - $ref: 'shared.yaml#/components/parameters/PeriodFrom'
        - $ref: 'shared.yaml#/components/parameters/PeriodTo'
        - $ref: 'shared.yaml#/components/parameters/Page'
        - $ref: 'shared.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Коммиты пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'shared.yaml#/components/schemas/Commit'
              example:
                - hash: "a1b2c3d4..."
                  authorEmail: "boris@x5.ru"
                  commitDate: "2026-05-10T12:00:00"
                  merge: false
                  addedLines: 42
                  deletedLines: 7
                  testAddedLines: 12
                  message: "12345 fix the bug"
                  taskNumber: "12345"
                  repo: "xrg-core"
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /users:
    get:
      tags:
        - Users
      summary: Список пользователей
      description: |
        Все записи unified_user. Используется для picker'а в разделе Performance Review
        и для управления командами. Опциональный фильтр ?team= — вернуть только людей
        указанной команды (team= без значения или с пустой строкой не фильтрует).
      operationId: listUsers
      parameters:
        - name: team
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по команде. Без параметра — все пользователи.
          example: "Platform"
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'shared.yaml#/components/schemas/UserProfile'
              example:
                - id: 42
                  email: "boris@x5.ru"
                  username: "boris"
                  name: "Boris"
                  avatarUrl: null
                  kaitenId: 7
                  gitlabId: null
                  team: "Platform"
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

  /users/{email}/team:
    put:
      tags:
        - Users
      summary: Назначить/снять команду пользователя
      description: |
        Управление командами с фронта. team в теле — имя команды; null снимает привязку.
      operationId: setUserTeam
      parameters:
        - name: email
          in: path
          required: true
          schema:
            $ref: 'shared.yaml#/components/schemas/Email'
          description: Email пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTeamRequest'
            example:
              team: "Platform"
      responses:
        '200':
          description: Обновлённый профиль пользователя
          content:
            application/json:
              schema:
                $ref: 'shared.yaml#/components/schemas/UserProfile'
              example:
                id: 42
                email: "boris@x5.ru"
                username: "boris"
                name: "Boris"
                avatarUrl: null
                kaitenId: 7
                gitlabId: null
                team: "Platform"
        '404':
          $ref: 'shared.yaml#/components/responses/NotFound'
        '400':
          $ref: 'shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: 'shared.yaml#/components/responses/InternalError'

components:
  schemas:
    SetTeamRequest:
      type: object
      required:
        - team
      properties:
        team:
          type: string
          nullable: true
          description: Имя команды. null — снять привязку.
          example: "Platform"

    UserProfileResponse:
      type: object
      required:
        - user
        - summary
        - commits
        - cards
      properties:
        user:
          $ref: 'shared.yaml#/components/schemas/UserProfile'
        summary:
          $ref: 'shared.yaml#/components/schemas/UserStatsSummary'
        commits:
          type: array
          description: Первые 500 коммитов пользователя за период
          items:
            $ref: 'shared.yaml#/components/schemas/Commit'
        cards:
          type: array
          description: Карточки Kaiten live (обновлённые после from)
          items:
            $ref: 'shared.yaml#/components/schemas/KaitenCard'
